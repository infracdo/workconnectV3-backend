services:

  frontend:
    build:
      context: /opt/workconnectv2/workconnect-fe
      dockerfile: Dockerfile
    container_name: wcv2-fe
    restart: unless-stopped
    ports:
      - "8080:80"  # Change port as necessary
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wcv2-be
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./target:/app/target
      - ./logs:/app/logs
    environment:
      DB_HOST: 10.42.4.15
      DB_PORT: 5432
      DB_NAME: nms
      DB_USERNAME: admin
      DB_PASSWORD: admin
    ports:
      - "7500:7500"
    networks:
      - app-network
    depends_on:
      - frontend
    command: ./mvnw spring-boot:run

