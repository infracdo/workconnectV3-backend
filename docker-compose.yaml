services:

  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.11.0-debian}
    volumes:
      - C:/apisix-docker/example/apisix_conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
    container_name: apisix
    environment:
      - APISIX_RUN_USER=nobody 
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9092:9092/tcp"
    networks:
      wcv3:

  dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: dashboard
    restart: always
    volumes:
      - C:/apisix-docker/all-in-one/apisix-dashboard/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "9000:9000/tcp"
    networks:
      wcv3:

  etcd:
    image: bitnami/etcd:3.5.17
    restart: always
    container_name: etcd
    volumes:
      - etcd_data:/bitnami/etcd
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    healthcheck:
      test: "etcdctl endpoint health"
      interval: 5s
      timeout: 30s
      retries: 5
    ports:
      - "2379:2379/tcp"
    networks:
      wcv3:

  frontend:
    container_name: frontend
    build:
      context: ../workconnectV3-frontend-main
      dockerfile: Dockerfile
    ports:
      - "8080:80" 
    networks:
      wcv3:
    restart: unless-stopped

  autoprov:
    container_name: backend
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src
      - ./target:/app/target
      - ./logs:/app/logs
    ports:
      - "8081:8081"
    networks:
      wcv3:
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  wcv3:
    driver: bridge

volumes:
  etcd_data:
    driver: local